name: CI

on:
    push:
        branches: ["main"]
        tags: ["v*"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.18.0"
                  cache: "npm"
            - run: npm ci
            - run: npm run qa

    deploy-production:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: quality
        permissions:
            contents: write
        concurrency:
            group: indexnow-sports-production
            cancel-in-progress: false
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - name: Verify tag belongs to main
              run: |
                  git fetch origin main
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.18.0"
                  cache: "npm"
            - run: npm ci
            - run: npm run build
              env:
                  PUBLIC_APP_VERSION: ${{ github.ref_name }}
            - name: Detect changed production pages
              id: indexnow
              uses: Game-Bob/ai-knows/.github/actions/indexnow-detect@main
              with:
                  dist: dist
                  state-branch: indexnow-state
                  route-map: |
                      [
                        {"baseUrl":"https://www.jjlmoya.es","pathPrefixes":["/utilidades/" ]},
                        {"baseUrl":"https://www.gamebob.dev","pathPrefixes":["/en/utilities/","/fr/utilitaires/","/de/werkzeuge/","/it/utilita/","/pt/utilidades/","/nl/hulpmiddelen/","/sv/verktyg/","/pl/narzedzia/","/id/utilitas/","/tr/araclar/","/ru/instrumenty/","/ja/utilities/","/ko/utilities/","/zh/utilities/"]}
                      ]
            - name: Deploy both domains to Cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: ./node_modules/.bin/wrangler deploy
            - name: Save deployed page manifest
              continue-on-error: true
              uses: Game-Bob/ai-knows/.github/actions/indexnow-save@main
              with:
                  state-branch: indexnow-state
            - name: Notify IndexNow
              uses: Game-Bob/ai-knows/.github/actions/indexnow-submit@main
              with:
                  manifest: ${{ steps.indexnow.outputs.manifest }}
                  site-config: |
                      [
                        {"baseUrl":"https://www.jjlmoya.es","keyLocation":"https://www.jjlmoya.es/jjlmoya-indexnow-2026.txt"},
                        {"baseUrl":"https://www.gamebob.dev","keyLocation":"https://www.gamebob.dev/gamebob-indexnow-2026.txt"}
                      ]
